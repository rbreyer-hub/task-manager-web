<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<script>
  // Apply the saved theme before first paint to avoid a flash
  try { const t = localStorage.getItem('taskBoard.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=20261104d">
</head>
<body>

<!-- ── Top bar ── -->
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle sidebar">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="brand">
    <span class="brand-mark"><i></i><i></i><i></i></span>
    <span class="brand-name">Task Board</span>
  </div>
  <div class="search-wrap" id="searchWrap" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Search tasks" autocomplete="off">
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="themeBtn" data-mode="system" title="Theme: match system" aria-label="Change theme">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg class="i-auto" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="notifBtn" title="Enable reminder notifications" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="btn btn-ghost" id="authSignIn" hidden>Sign in with Google</button>
    <div class="user-chip" id="authUserChip" hidden>
      <img id="authUserAvatar" alt="" referrerpolicy="no-referrer">
      <span id="authUserName"></span>
      <button class="link-btn" id="authSignOut">Sign out</button>
    </div>
  </div>
</header>

<!-- ── Signed-out landing ── -->
<section class="landing" id="landing" hidden>
  <div class="landing-card">
    <span class="brand-mark big"><i></i><i></i><i></i></span>
    <h1>Plan projects. Ship tasks.</h1>
    <p>Projects, tasks, due dates and reminders, synced across all your devices.</p>
    <button class="btn btn-primary btn-lg" id="landingSignIn">
      <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>
  </div>
</section>

<!-- ── Loading ── -->
<section class="loading" id="loading"><div class="spinner"></div></section>

<!-- ── App ── -->
<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="side-section">
      <div class="side-label">My work</div>
      <nav id="smartNav"></nav>
    </div>
    <div class="side-section">
      <div class="side-label">
        Projects
        <button class="icon-btn sm" id="addProjectBtn" title="New project" aria-label="New project">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <nav id="projectNav"></nav>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="main-head">
      <div class="main-title-row">
        <span class="title-dot" id="titleDot"></span>
        <h2 id="mainTitle">Today</h2>
        <button class="icon-btn sm" id="editProjectBtn" title="Edit project" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 20h4L19 9l-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="main-sub" id="mainSub"></p>
      <div class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab active" data-mode="table" role="tab">
            <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 5h18M3 12h18M3 19h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Table
          </button>
          <button class="tab" data-mode="board" role="tab">
            <svg viewBox="0 0 24 24" width="15" height="15"><rect x="3" y="4" width="5" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="4" width="5" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="17" y="4" width="4" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            Kanban
          </button>
          <button class="tab" data-mode="calendar" role="tab">
            <svg viewBox="0 0 24 24" width="15" height="15"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Calendar
          </button>
        </div>
        <button class="btn btn-primary" id="newTaskBtn">New task</button>
      </div>
    </div>
    <div class="main-body" id="mainBody"></div>
  </main>
</div>

<!-- ── Task drawer ── -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <form id="taskForm" autocomplete="off">
    <div class="drawer-head">
      <input id="fTitle" class="drawer-title" placeholder="Task name" required maxlength="200">
      <button type="button" class="icon-btn" id="drawerClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <div class="field-grid">
        <label>Project</label>
        <select id="fProject"></select>

        <label>Status</label>
        <div class="pill-picker" id="fStatus"></div>

        <label>Priority</label>
        <div class="pill-picker" id="fPriority"></div>

        <label>Due date</label>
        <div class="inline-fields">
          <input type="date" id="fDue">
          <input type="time" id="fDueTime">
        </div>

        <label>Reminder</label>
        <div class="inline-fields col">
          <select id="fReminder">
            <option value="none">No reminder</option>
            <option value="atdue">At due time</option>
            <option value="15m">15 minutes before</option>
            <option value="1h">1 hour before</option>
            <option value="1d">1 day before</option>
            <option value="custom">Custom date &amp; time…</option>
          </select>
          <input type="datetime-local" id="fReminderAt" hidden>
          <small class="hint" id="reminderHint"></small>
        </div>
      </div>

      <div class="block-label sub-head">
        <span>Subtasks</span>
        <span id="subCount"></span>
      </div>
      <div class="sub-progress" id="subProgress" hidden><span></span></div>
      <ul class="sub-list" id="subList"></ul>
      <input id="subAdd" class="sub-add" placeholder="+ Add subtask, press Enter" maxlength="200">

      <label class="block-label" for="fNotes">Notes</label>
      <textarea id="fNotes" rows="6" placeholder="Add details, links, checklists…"></textarea>

      <p class="meta-line" id="taskMeta"></p>
    </div>
    <div class="drawer-foot">
      <button type="button" class="btn btn-danger-ghost" id="deleteTaskBtn">Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="cancelTaskBtn">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</aside>

<!-- ── Project dialog ── -->
<dialog class="modal" id="projectModal">
  <form id="projectForm" method="dialog" autocomplete="off">
    <h3 id="projectModalTitle">New project</h3>
    <label class="block-label" for="pName">Name</label>
    <input id="pName" required maxlength="80" placeholder="e.g. Kitchen remodel">
    <label class="block-label">Color</label>
    <div class="swatches" id="pColors"></div>
    <div class="modal-foot">
      <button type="button" class="btn btn-danger-ghost" id="deleteProjectBtn" hidden>Delete project</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost" id="cancelProjectBtn">Cancel</button>
      <button type="submit" class="btn btn-primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<!-- ── Floating pill menu ── -->
<div class="pop-menu" id="popMenu" hidden></div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAction" hidden></button></div>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js?v=20261104d"></script>
</body>
</html>
